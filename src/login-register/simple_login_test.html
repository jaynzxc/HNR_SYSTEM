<!DOCTYPE html>
<html>
<head>
    <title>Simple Login Test</title>
</head>
<body>
    <h1>Simple Login Test</h1>
    <form id="simpleLoginForm">
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="roldantiu89@gmail.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="customer123" required>
        </div>
        <button type="submit">Login & Redirect Immediately</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('simpleLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<p>Logging in...</p>';
            
            try {
                const response = await fetch('./api/auth/auth.php/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                console.log('Login response:', data);
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = '<p style="color: green;">Login successful! Redirecting...</p>';
                    
                    // Get redirect URL immediately
                    const redirectUrl = data.data?.redirect_to;
                    console.log('Redirect URL:', redirectUrl);
                    
                    // Redirect immediately without timeout
                    if (redirectUrl) {
                        console.log('Redirecting to:', redirectUrl);
                        window.location.href = redirectUrl;
                    } else {
                        console.log('Using fallback redirect');
                        window.location.href = '../customer_portal/index.html';
                    }
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Login failed: ${data.error || 'Unknown error'}</p>`;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Debug Working Login</title>
</head>
<body>
    <h1>Debug Working Login</h1>
    <button onclick="testWorkingLogin()">Test Working Login</button>
    <div id="result"></div>
    
    <script>
        async function testWorkingLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing working login...</p>';
            
            try {
                console.log('🔍 Making API call...');
                
                const response = await fetch('./api/auth/auth.php/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'mia.cruz@email.com',
                        password: 'customer123'
                    })
                });
                
                console.log('🔍 Response status:', response.status);
                console.log('🔍 Response headers:', response.headers);
                
                const responseText = await response.text();
                console.log('🔍 Raw response text:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('🔍 Parsed JSON:', data);
                } catch (parseError) {
                    console.log('❌ JSON parse error:', parseError);
                    resultDiv.innerHTML = `<p style="color: red;">JSON Parse Error: ${parseError.message}</p><p>Raw Response: ${responseText}</p>`;
                    return;
                }
                
                resultDiv.innerHTML = `
                    <h2>Complete Response Analysis:</h2>
                    <p><strong>HTTP Status:</strong> ${response.status}</p>
                    <p><strong>Raw Response:</strong></p>
                    <pre>${responseText}</pre>
                    <p><strong>Parsed Data:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p><strong>Success Property:</strong> ${data.success}</p>
                    <p><strong>Data Object:</strong> ${JSON.stringify(data.data, null, 2)}</p>
                    <p><strong>Redirect URL:</strong> ${data.data?.redirect_to}</p>
                    <p><strong>Redirect URL Type:</strong> ${typeof data.data?.redirect_to}</p>
                    
                    <button onclick="attemptRedirect('${data.data?.redirect_to}')">Attempt Redirect</button>
                    <button onclick="forceRedirect()">Force Redirect to Customer Portal</button>
                `;
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        function attemptRedirect(url) {
            console.log('🔍 Attempting redirect to:', url);
            if (url && url !== 'undefined' && url !== null && url !== '') {
                console.log('✅ Redirecting to:', url);
                window.location.href = url;
            } else {
                console.log('❌ Invalid URL:', url);
            }
        }
        
        function forceRedirect() {
            console.log('🔍 Forcing redirect to customer portal');
            window.location.href = '../customer_portal/index.html';
        }
    </script>
</body>
</html>

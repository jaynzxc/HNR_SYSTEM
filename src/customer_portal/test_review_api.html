<!DOCTYPE html>
<html>
<head>
    <title>Test Add Review API</title>
</head>
<body>
    <h1>Test Add Review API</h1>
    <button onclick="testAddReview()">Test Add Review</button>
    <div id="result"></div>
    
    <script>
        async function testAddReview() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing add review API...</p>';
            
            try {
                const reviewData = {
                    review_type: 'hotel_stay',
                    rating: 5,
                    review_text: 'Test review from dashboard'
                };
                
                const response = await fetch('./api/auth/user.php?endpoint=add-review', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(reviewData)
                });
                
                const data = await response.json();
                
                console.log('Add Review Response:', data);
                
                resultDiv.innerHTML = `
                    <h2>Test Results:</h2>
                    <p><strong>HTTP Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    
                    <button onclick="testGetReviews()">Test Get Reviews</button>
                    <button onclick="window.location.href='index.html'">Back to Dashboard</button>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        async function testGetReviews() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing get reviews API...</p>';
            
            try {
                const response = await fetch('./api/auth/user.php?endpoint=reviews', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                console.log('Get Reviews Response:', data);
                
                resultDiv.innerHTML = `
                    <h2>Get Reviews Test Results:</h2>
                    <p><strong>HTTP Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p><strong>Reviews Count:</strong> ${data.data ? data.data.length : 0}</p>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
